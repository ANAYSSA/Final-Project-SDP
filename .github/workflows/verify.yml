name: Verify Java project
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode verify
      - run: java -jar target/hearth-and-table-1.0.0.jar --demo
      - name: Enforce six-pattern package layout
        run: python3 scripts/check_structure.py
